name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # whisper.cpp 源码不进仓库（Vendor/ 被 gitignore），构建前先拉取。
      - name: Fetch whisper.cpp
        run: Scripts/fetch-whisper.sh

      # 发布说明来自 CHANGELOG.md 中与标签同版本的一节；缺失时在构建前就失败。
      - name: Release notes (changelog gate)
        run: Scripts/release-notes.sh "${GITHUB_REF_NAME#v}" build/release-notes.md

      - name: Test (release gate)
        run: swift run MiVibeTests

      # CI artifacts are ad-hoc signed: fine for verification, but the build users
      # actually install should come from a machine with the local signing identity
      # (Scripts/deploy.sh), so macOS privacy grants survive reinstalls.
      - name: Build app bundle
        run: MIVIBE_SIGN_IDENTITY=- Scripts/build-app.sh release

      - name: Package DMG and zip
        run: |
          Scripts/make-dmg.sh
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/MiVibe.app/Contents/Info.plist)"
          ditto -c -k --sequesterRsrc --keepParent build/MiVibe.app "build/MiVibe-${VERSION}-arm64.zip"
          # The tag is the release identity; refuse to publish if it disagrees with the bundle.
          [ "v${VERSION}" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != bundle version $VERSION" >&2; exit 1; }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Idempotent: a locally created release (with the properly signed build)
        # may already exist for the tag — then just add the CI artifacts.
        # Notes: CHANGELOG section + install guide; --generate-notes appends the compare link.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/MiVibe-*.dmg build/MiVibe-*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/MiVibe-*.dmg build/MiVibe-*.zip \
              --title "MiVibe $GITHUB_REF_NAME" --notes-file build/release-notes.md --generate-notes --verify-tag
          fi
