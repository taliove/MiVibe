name: 功能建议 · Feature request
description: 提出新功能或改进 · Suggest a feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 · Problem
      description: 你在什么场景下遇到了什么不便？What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法 · Proposal
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 · Alternatives considered
